name: Portfolio checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: Offline site integrity and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify page links, disclosures, CSP hygiene, and self-hosted assets
        run: python3 scripts/check_site.py
      - name: Verify JavaScript syntax
        run: |
          node --version
          node --check script.js
          node --check scripts/hero-section.js
          node --check scripts/social-card.js
          node --check lab/pathfinding/pathfinding.js
          node --check lab/pathfinding/app.js
          node --check lab/security-events/detection.js
          node --check lab/security-events/app.js
          node --check lab/ecommerce/model.js
          node --check lab/ecommerce/app.js
      - name: Run unit tests for all labs (Node built-in test runner, no dependencies)
        run: node --test tests/unit/*.test.js
  browser:
    name: Browser tests (Playwright, desktop and mobile viewports)
    # Playwright 1.56.1 does not install Chromium on the current ubuntu-latest (26.04) runner.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Playwright outside the repository (the site itself stays dependency-free)
        run: |
          mkdir -p "$RUNNER_TEMP/playwright"
          cd "$RUNNER_TEMP/playwright"
          npm init -y > /dev/null
          npm install --no-audit --no-fund --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run browser tests
        env:
          NODE_PATH: ${{ runner.temp }}/playwright/node_modules
        run: node --test tests/browser/*.test.js

  visual:
    name: Visual baseline screenshots (system Chrome, no npm)
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Capture Chrome hero and experience baselines
        env:
          VISUAL_REVIEW_DIR: ${{ runner.temp }}/architect-lab-chrome-baseline
        run: node scripts/capture-visual-native.mjs
      - name: Upload browser-independent visual captures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: architect-lab-chrome-baseline
          path: ${{ runner.temp }}/architect-lab-chrome-baseline/
          if-no-files-found: warn
          retention-days: 14
