name: Portfolio checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: Offline site integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify page links, scientific disclosures, and self-hosted assets
        run: python3 scripts/check_site.py
      - name: Verify JavaScript syntax
        run: node --check script.js
